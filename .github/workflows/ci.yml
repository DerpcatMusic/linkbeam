name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: lint / check / typecheck / test / build (scripts that exist)
        run: |
          set -e
          for s in lint check typecheck test build smoke; do
            if jq -e --arg s "$s" '.scripts[$s]' package.json >/dev/null; then
              echo "::group::$s"; bun run "$s"; echo "::endgroup::"
            fi
          done

  # Single required check for branch rulesets and the merge queue.
  conclusion:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | grep -qE '"result": "(failure|cancelled)"' && exit 1 || true
